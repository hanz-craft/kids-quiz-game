<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Parts Quiz Game! 🧠🦵</title>
    <style>
        /* =========================================
           CUTE & COLORFUL CSS DESIGN
        ========================================= */
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2D3142;
            --team1: #3A86FF;
            --team2: #FF006E;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .screen {
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .active {
            display: block;
        }

        /* Top Bar: Score & Timer */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .score-box {
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
        }

        #team1-score { background-color: var(--team1); }
        #team2-score { background-color: var(--team2); }

        .timer-circle {
            background: var(--primary);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            border: 4px solid white;
        }

        /* Turn Indicator */
        .turn-announcer {
            font-size: 2rem;
            margin: 10px 0;
            padding: 10px;
            border-radius: 20px;
            color: white;
            animation: bounce 1.5s infinite;
        }

        /* Question Area */
        .question-card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .question-image {
            font-size: 8rem; /* Used for emojis */
            margin: 10px 0;
            line-height: 1;
        }

        .question-image img {
            max-width: 200px;
            border-radius: 20px;
        }

        .question-text {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        /* Buttons */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            font-family: inherit;
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .btn {
            font-size: 1.5rem;
            padding: 20px;
            background: var(--secondary);
            color: white;
            box-shadow: 0 8px 0 #38A39B;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 13px 0 #38A39B;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #38A39B;
        }

        .btn-start {
            background: var(--primary);
            box-shadow: 0 8px 0 #D65A5A;
            font-size: 2.5rem;
            padding: 25px 50px;
            margin-top: 30px;
            animation: bounce 2s infinite;
        }

        /* Answer States */
        .btn.correct {
            background: #2ecc71 !important;
            box-shadow: 0 8px 0 #27ae60 !important;
            animation: pulse 0.5s;
        }

        .btn.wrong {
            background: #e74c3c !important;
            box-shadow: 0 8px 0 #c0392b !important;
            opacity: 0.7;
        }

        /* Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .winner-text {
            font-size: 4rem;
            color: var(--primary);
            text-shadow: 3px 3px 0px white;
            margin-top: 50px;
        }

        /* Mobile Friendly */
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .top-bar { font-size: 1.2rem; padding: 10px; }
            .question-text { font-size: 1.5rem; }
            .timer-circle { width: 50px; height: 50px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="start-screen" class="screen active">
            <h1 style="font-size: 3.5rem; color: #fff; text-shadow: 4px 4px 0px var(--primary);">
                Body Parts Quiz! 🖐️👁️
            </h1>
            <p style="font-size: 1.5rem; background: white; padding: 20px; border-radius: 20px;">
                Get ready! Split into Team 1 (Blue) and Team 2 (Pink)!
            </p>
            <button class="btn btn-start" onclick="startGame()">PLAY!</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="top-bar">
                <div id="team1-score" class="score-box">Team 1: <span>0</span></div>
                <div class="timer-circle" id="timer">15</div>
                <div id="team2-score" class="score-box">Team 2: <span>0</span></div>
            </div>

            <div id="turn-indicator" class="turn-announcer">Team 1's Turn!</div>

            <div class="question-card">
                <div class="question-image" id="question-image">👀</div>
                <div class="question-text" id="question-text">What do you use to see?</div>
                <div class="options-grid" id="options-container">
                    </div>
            </div>
        </div>

        <div id="end-screen" class="screen">
            <div class="winner-text" id="winner-text">Team 1 Wins! 🎉</div>
            <h2 style="font-size: 2.5rem;" id="final-score-text"></h2>
            <button class="btn btn-start" onclick="location.reload()">Play Again!</button>
        </div>

    </div>

    <script>
        /* =========================================
           EDITABLE QUIZ DATA
           Easily change questions, emojis, and answers here!
           Answers array starts at 0. (0 = First, 1 = Second, etc.)
        ========================================= */
        const quizData = [
            {
                image: "👀", // To use a real image, change this to: "<img src='eye.png'>"
                question: "Which part of the body do you use to see?",
                options: ["Ears", "Eyes", "Nose", "Mouth"],
                correctIndex: 1 
            },
            {
                image: "👃", 
                question: "I use this to smell yummy cookies! What is it?",
                options: ["Nose", "Knee", "Hand", "Hair"],
                correctIndex: 0
            },
            {
                image: "👂", 
                question: "Which body part helps you listen to music?",
                options: ["Eyes", "Foot", "Ears", "Teeth"],
                correctIndex: 2
            },
            {
                image: "🦵", 
                question: "What part of your body bends your leg?",
                options: ["Elbow", "Shoulder", "Knee", "Chin"],
                correctIndex: 2
            },
            {
                image: "✋", 
                question: "I have 5 fingers. What am I?",
                options: ["A Foot", "A Hand", "A Head", "A Tummy"],
                correctIndex: 1
            },
            {
                image: "❤️", 
                question: "What goes thump-thump and pumps blood inside you?",
                options: ["Brain", "Lungs", "Stomach", "Heart"],
                correctIndex: 3
            },
            {
                image: "🦷", 
                question: "What do you use to bite and chew your food?",
                options: ["Tongue", "Lips", "Cheeks", "Teeth"],
                correctIndex: 3
            },
            {
                image: "🧠", 
                question: "What is inside your head and helps you think?",
                options: ["Brain", "Heart", "Bones", "Muscles"],
                correctIndex: 0
            }
        ];

        /* =========================================
           GAME LOGIC & VARIABLES
        ========================================= */
        let currentQuestionIndex = 0;
        let scores = { team1: 0, team2: 0 };
        let currentTeam = 1; // 1 for Team 1, 2 for Team 2
        let timeLeft = 15;
        let timerInterval;
        let isAnswering = false;

        // Sound System (Built-in Web Audio API - no files needed!)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Uncomment the line below if you added the <audio> tag in the HTML
            // document.getElementById('bg-music').play();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                // Happy Ding!
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                // Sad Buzz!
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        /* =========================================
           GAME FUNCTIONS
        ========================================= */
        function startGame() {
            initAudio(); // Starts the sound engine on user interaction
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            // Shuffle questions for fun
            quizData.sort(() => Math.random() - 0.5);
            
            loadQuestion();
        }

        function loadQuestion() {
            isAnswering = false;
            clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;

            const q = quizData[currentQuestionIndex];
            
            // Update Turn Indicator
            const turnInd = document.getElementById('turn-indicator');
            turnInd.innerText = `Team ${currentTeam}'s Turn!`;
            turnInd.style.backgroundColor = currentTeam === 1 ? 'var(--team1)' : 'var(--team2)';

            // Load Content
            document.getElementById('question-image').innerHTML = q.image;
            document.getElementById('question-text').innerText = q.question;

            // Load Buttons
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            // Start Timer
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswering) return; // Prevent double clicking
            isAnswering = true;
            clearInterval(timerInterval);

            const q = quizData[currentQuestionIndex];
            const isCorrect = (selectedIndex === q.correctIndex);
            const allButtons = document.getElementById('options-container').children;

            if (isCorrect) {
                playSound('correct');
                btnElement.classList.add('correct');
                scores[`team${currentTeam}`] += 10;
                updateScores();
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong');
                // Highlight the correct answer for them to learn
                allButtons[q.correctIndex].classList.add('correct');
            }

            // Wait 2.5 seconds, then go to next question
            setTimeout(nextQuestion, 2500);
        }

        function handleTimeOut() {
            if (isAnswering) return;
            isAnswering = true;
            playSound('wrong');
            
            const q = quizData[currentQuestionIndex];
            const allButtons = document.getElementById('options-container').children;
            
            // Highlight correct answer since time ran out
            allButtons[q.correctIndex].classList.add('correct');

            setTimeout(nextQuestion, 2500);
        }

        function updateScores() {
            document.querySelector('#team1-score span').innerText = scores.team1;
            document.querySelector('#team2-score span').innerText = scores.team2;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            currentTeam = currentTeam === 1 ? 2 : 1; // Switch teams

            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('end-screen').classList.add('active');

            const winText = document.getElementById('winner-text');
            const scoreText = document.getElementById('final-score-text');

            if (scores.team1 > scores.team2) {
                winText.innerText = "Team 1 Wins! 🏆";
                winText.style.color = "var(--team1)";
            } else if (scores.team2 > scores.team1) {
                winText.innerText = "Team 2 Wins! 🏆";
                winText.style.color = "var(--team2)";
            } else {
                winText.innerText = "It's a Tie! 🤝";
                winText.style.color = "var(--secondary)";
            }

            scoreText.innerText = `Team 1: ${scores.team1} points | Team 2: ${scores.team2} points`;
        }
    </script>
</body>
</html>
