<!DOCTYPE html>
<html>
<head>
  <title>Kids Quiz Game</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
      padding: 30px;
    }

    .game-box {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h1 {
      color: #ff6600;
    }

    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #4CAF50;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    #result {
      font-size: 24px;
      margin-top: 20px;
      color: blue;
    }
  </style>
</head>

<body>

<div class="game-box">
  <h1>🐵 Kids Quiz Game 🐵</h1>

  <h2>What animal says "Meow"?</h2>

  <button onclick="checkAnswer('dog')">Dog</button>
  <button onclick="checkAnswer('cat')">Cat</button>
  <button onclick="checkAnswer('lion')">Lion</button>

  <div id="result"></div>
</div>

<script>
function checkAnswer(answer) {
  if(answer === 'cat') {
    document.getElementById("result").innerHTML = "🎉 Correct!";
  } else {
    document.getElementById("result").innerHTML = "❌ Wrong Answer!";
  }
}
</script>

</body>
</html>
