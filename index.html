<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parts of the Body Quiz - เกมทายอวัยวะ</title>
    <style>
        /* =========================================
           NEON CUTE CSS DESIGN
        ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Kanit:wght@400;600&display=swap');

        :root {
            --bg-color: #1a1a2e;
            --team1-color: #ff007f; /* Neon Pink */
            --team2-color: #00f3ff; /* Neon Cyan */
            --correct-color: #39ff14; /* Neon Green */
            --wrong-color: #ff3333;
            --text-light: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Kanit', 'Fredoka One', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            overflow: hidden;
            user-select: none; /* Prevent text selection while tapping */
        }

        /* Screens */
        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        .active { display: flex; }

        /* Typography & Neon Text */
        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff007f, 0 0 30px #ff007f;
        }

        h2 { font-size: 2.5rem; margin: 10px; }
        
        .emoji-pic {
            font-size: 8rem;
            margin: 10px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
        }

        /* Buttons */
        .btn {
            background: transparent;
            border: 4px solid var(--text-light);
            color: var(--text-light);
            font-size: 2rem;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            margin: 10px;
            box-shadow: 0 0 10px var(--text-light) inset, 0 0 10px var(--text-light);
        }

        .btn:active { transform: scale(0.95); }

        .btn-t1 { border-color: var(--team1-color); box-shadow: 0 0 15px var(--team1-color) inset, 0 0 15px var(--team1-color); }
        .btn-t2 { border-color: var(--team2-color); box-shadow: 0 0 15px var(--team2-color) inset, 0 0 15px var(--team2-color); }
        
        .btn-t1:hover { background: var(--team1-color); color: #fff; }
        .btn-t2:hover { background: var(--team2-color); color: #1a1a2e; }

        /* Top Navigation & Status Bar */
        .top-bar {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .nav-btn {
            font-size: 1.2rem;
            padding: 10px 20px;
            background: #333;
            border: 2px solid #fff;
            color: white;
            border-radius: 15px;
            cursor: pointer;
        }

        .timer-circle {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffe600;
            text-shadow: 0 0 15px #ffe600;
        }

        /* Split Screen Game Layout */
        .game-area {
            display: flex;
            width: 100%;
            height: 100%;
            padding-top: 80px; /* Space for top bar */
            box-sizing: border-box;
        }

        .team-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px dashed rgba(255,255,255,0.2);
            padding: 20px;
        }
        .team-side:last-child { border-right: none; }

        .team-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .t1-title { color: var(--team1-color); text-shadow: 0 0 10px var(--team1-color); }
        .t2-title { color: var(--team2-color); text-shadow: 0 0 10px var(--team2-color); }

        .score-box {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        /* Option Buttons Grid */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        .opt-btn {
            font-size: 2rem;
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #fff;
            background: #2a2a40;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Answer States */
        .opt-btn.correct {
            background: var(--correct-color);
            border-color: #fff;
            color: #000;
            box-shadow: 0 0 20px var(--correct-color);
            transform: scale(1.05);
        }

        .opt-btn.wrong {
            background: var(--wrong-color);
            opacity: 0.5;
        }
        
        .disabled { pointer-events: none; opacity: 0.8; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Mobile Layout Adjustments */
        @media (max-width: 768px) {
            .game-area { flex-direction: column; }
            .team-side { border-right: none; border-bottom: 2px dashed rgba(255,255,255,0.2); padding: 10px; }
            .team-side:last-child { border-bottom: none; }
            .emoji-pic { font-size: 4rem; margin: 0; }
            h2 { font-size: 1.5rem; }
            .opt-btn { font-size: 1.2rem; padding: 10px; }
            .top-bar { padding: 10px; }
            .timer-circle { font-size: 1.8rem; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <h1>Parts of the Body Quiz!</h1>
        <h2 style="color: #fff;">เกมทายอวัยวะ สำหรับเด็ก 3 ขวบ</h2>
        <div style="font-size: 5rem; margin: 20px;">👦👧</div>
        <button class="btn btn-t1" onclick="startGame()">PLAY (เล่นเลย)</button>
        <button class="btn" style="border-color: #aaa;" onclick="exitGame()">EXIT (ออก)</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="top-bar">
            <button class="nav-btn" onclick="goHome()">🏠 Home</button>
            <div id="timer" class="timer-circle">15</div>
            <button class="nav-btn" onclick="nextQuestion(true)">⏭️ Skip</button>
        </div>

        <div class="game-area">
            <div class="team-side">
                <div class="team-title t1-title">Team Pink</div>
                <div class="score-box" style="color: var(--team1-color);" id="score1">0</div>
                
                <div class="emoji-pic" id="q-pic1">👁️</div>
                <h2 id="q-text1">What is it?</h2>
                
                <div class="options-grid" id="options-team1">
                    </div>
            </div>

            <div class="team-side">
                <div class="team-title t2-title">Team Cyan</div>
                <div class="score-box" style="color: var(--team2-color);" id="score2">0</div>
                
                <div class="emoji-pic" id="q-pic2">👁️</div>
                <h2 id="q-text2">What is it?</h2>
                
                <div class="options-grid" id="options-team2">
                    </div>
            </div>
        </div>
    </div>

    <div id="end-screen" class="screen">
        <h1 id="winner-text" style="font-size: 5rem;">Team 1 Wins!</h1>
        <div style="font-size: 4rem; margin: 20px;">🏆✨</div>
        <h2 id="final-scores">Pink: 0 | Cyan: 0</h2>
        <button class="btn btn-t1" onclick="startGame()">Play Again (เล่นอีกครั้ง)</button>
        <button class="btn nav-btn" onclick="goHome()">🏠 Home</button>
    </div>

    <div id="exit-screen" class="screen">
        <h1>Goodbye! 👋</h1>
        <h2>บ๊ายบาย!</h2>
        <button class="btn nav-btn" onclick="goHome()">Go Back</button>
    </div>

        const quizData = [

        let currentQIndex = 0;

        let t2Answered = false;

        // Sound Engine (Web Audio API) - No external files needed!
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'bgm') {
                // Short happy sequence to act as start sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
                osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.2); // C#5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.4); // E5
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }
            else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } 
            else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        /* =========================================
           GAME LOGIC
        ========================================= */
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goHome() {
            clearInterval(timerInterval);
            switchScreen('home-screen');
        }

        function exitGame() {
            switchScreen('exit-screen');
        }

        function startGame() {
            playSound('bgm');
            scoreT1 = 0;
            scoreT2 = 0;
            updateScores();
            
            // Shuffle questions for variety
            quizData.sort(() => Math.random() - 0.5);
            currentQIndex = 0;
            
            switchScreen('game-screen');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQIndex >= quizData.length) {
                showWinner();
                return;
            }

            t1Answered = false;
            t2Answered = false;
            timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('timer').style.color = "#ffe600";
            
            const q = quizData[currentQIndex];

            // Update pictures and questions on both sides
            document.getElementById('q-pic1').innerHTML = q.picture;
            document.getElementById('q-text1').innerText = "What is it?";
            document.getElementById('q-pic2').innerHTML = q.picture;
            document.getElementById('q-text2').innerText = "What is it?";

            // Generate buttons for Team 1
            const opts1 = document.getElementById('options-team1');
            opts1.innerHTML = '';
            opts1.classList.remove('disabled');
            q.options.forEach((opt, index) => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(1, index, btn);
                opts1.appendChild(btn);
            });

            // Generate buttons for Team 2
            const opts2 = document.getElementById('options-team2');
            opts2.innerHTML = '';
