<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Parts</title>
    <style>
        /* =========================================
           NEON COLORFUL DESIGN & CSS
        ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        :root {
            --bg-color: #0f0c29;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00c8;
            --neon-green: #00ff66;
            --neon-yellow: #fffb00;
            --neon-red: #ff3333;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            background: var(--bg-color);
            color: white;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .active {
            display: flex;
        }

        /* Nav Bar */
        .nav-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 2px solid var(--neon-yellow);
            box-shadow: 0 0 15px var(--neon-yellow);
            margin-bottom: 20px;
            z-index: 10;
        }

        .nav-btn {
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: white;
            color: black;
        }

        /* Typography & Glows */
        h1 {
            font-size: 4rem;
            text-align: center;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
            margin-bottom: 30px;
        }

        .timer {
            font-size: 3rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 15px var(--neon-yellow);
            animation: pulse 1s infinite alternate;
        }

        /* Question Area */
        .question-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .question-image {
            font-size: 8rem;
            line-height: 1.2;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            animation: bounce 2s infinite;
        }

        .question-text {
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-green);
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 20px;
            border: 2px solid var(--neon-green);
        }

        /* Split Screen Play Area */
        .split-area {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            flex: 1;
        }

        .team-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.4);
            border: 4px solid;
            box-shadow: inset 0 0 20px, 0 0 20px;
        }

        .team1 {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        .team2 {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .score {
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            color: white;
            text-shadow: 0 0 10px currentColor;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .btn-option {
            background: transparent;
            color: white;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 20px 10px;
            border-radius: 20px;
            border: 3px solid;
            cursor: pointer;
            transition: all 0.1s;
            word-wrap: break-word;
        }

        .team1 .btn-option {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }
        
        .team2 .btn-option {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .btn-option:active {
            transform: scale(0.95);
        }

        /* Correct / Wrong States */
        .btn-option.correct {
            background: var(--neon-green) !important;
            color: black !important;
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 30px var(--neon-green) !important;
        }

        .btn-option.wrong {
            background: var(--neon-red) !important;
            color: white !important;
            border-color: var(--neon-red) !important;
            opacity: 0.5;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        /* Big Play Button */
        .btn-play {
            background: transparent;
            color: var(--neon-green);
            border: 4px solid var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green), inset 0 0 20px var(--neon-green);
            font-size: 3rem;
            padding: 20px 60px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 900;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-play:hover {
            background: var(--neon-green);
            color: black;
        }

        .winner-text {
            font-size: 5rem;
            text-align: center;
            animation: bounce 1s infinite;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes pulse { from { opacity: 0.8; transform: scale(1); } to { opacity: 1; transform: scale(1.1); } }

        /* Mobile Friendly */
        @media (max-width: 800px) {
            .split-area { flex-direction: column; }
            .team-board { padding: 10px; border-width: 2px; }
            h1 { font-size: 2.5rem; }
            .question-image { font-size: 5rem; margin: 0; }
            .question-text { font-size: 1.2rem; padding: 10px; }
            .btn-option { font-size: 1.1rem; padding: 15px 5px; }
            .timer { font-size: 2rem; }
            .score { font-size: 1.5rem; margin-bottom: 10px;}
        }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <h1>Body Parts<br>Vocabulary Quiz! 🦁</h1>
        <h2 style="color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink);">For Grade 1 & Kindergarten</h2>
        <button class="btn-play" onclick="startGame()">Start Game</button>
        <button class="nav-btn" style="margin-top: 30px; border-color: var(--neon-red);" onclick="exitGame()">Exit</button>
    </div>

    <div id="screen-game" class="screen">
        <div class="nav-bar">
            <button class="nav-btn" onclick="goHome()">🏠 Home</button>
            <div id="timer" class="timer">15</div>
            <button class="nav-btn" onclick="restartGame()">🔄 Restart</button>
        </div>

        <div class="question-container">
            <div id="q-image" class="question-image">❓</div>
            <div id="q-text" class="question-text">Loading question...</div>
        </div>

        <div class="split-area">
            <div class="team-board team1">
                <h2 class="score">Team 1: <span id="score1">0</span></h2>
                <div id="t1-options" class="options-grid"></div>
            </div>
            
            <div class="team-board team2">
                <h2 class="score">Team 2: <span id="score2">0</span></h2>
                <div id="t2-options" class="options-grid"></div>
            </div>
        </div>
    </div>

    <div id="screen-end" class="screen">
        <div id="winner-msg" class="winner-text">🏆 Team 1 Wins!</div>
        <h2 id="final-scores" style="font-size: 3rem; text-shadow: 0 0 15px white;">T1: 0 | T2: 0</h2>
        <br>
        <button class="btn-play" onclick="goHome()">Play Again</button>
    </div>

    <div id="screen-exit" class="screen">
        <h1>Goodbye! 👋</h1>
        <h2>You can close this tab now.</h2>
        <button class="nav-btn" onclick="goHome()">Go Back</button>
    </div>
